version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ihb_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      # Mount your TLS certs when enabling HTTPS.
      # - ./nginx/certs:/etc/nginx/certs:ro

  db:
    image: postgres:16
    container_name: ihb_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ihatebackground
      POSTGRES_USER: ihatebackground
      POSTGRES_PASSWORD: ihatebackground
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihatebackground -d ihatebackground"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ihb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ihb_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn ihatebackground.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "ihatebackground"
      DB_USER: "ihatebackground"
      DB_PASSWORD: "ihatebackground"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/2"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      DJANGO_SECURE_COOKIES: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - models_data:/app/models/rembg
    expose:
      - "8000"

  worker:
    build: .
    container_name: ihb_worker
    restart: unless-stopped
    command: celery -A ihatebackground worker -l info
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "ihatebackground"
      DB_USER: "ihatebackground"
      DB_PASSWORD: "ihatebackground"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/2"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - media_data:/app/media
      - models_data:/app/models/rembg

  beat:
    build: .
    container_name: ihb_beat
    restart: unless-stopped
    command: celery -A ihatebackground beat -l info
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "ihatebackground"
      DB_USER: "ihatebackground"
      DB_PASSWORD: "ihatebackground"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/2"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - media_data:/app/media
      - models_data:/app/models/rembg

volumes:
  postgres_data:
  media_data:
  static_data:
  models_data:
