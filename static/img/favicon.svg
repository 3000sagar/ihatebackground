<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Default for dark browser tabs */
    .i-shape {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

```
/* Auto switch for light mode */
@media (prefers-color-scheme: light) {
  .i-shape {
    stroke: #000000;
  }
}

/* Very subtle pulse (works in PWAs and modern browsers) */
@keyframes faviconPulse {
  0%   { stroke-width: 6; opacity: 1; }
  50%  { stroke-width: 7; opacity: 0.9; }
  100% { stroke-width: 6; opacity: 1; }
}

.animate {
  animation: faviconPulse 2.5s ease-in-out infinite;
}
